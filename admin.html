<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>翻訳文字数 管理</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7f5;color:#172033;font-family:system-ui,-apple-system,'Noto Sans JP',sans-serif}header{background:linear-gradient(135deg,#19a64b,#08712f);color:#fff;padding:18px}h1{font-size:21px;margin:0}main{max-width:680px;margin:auto;padding:16px}.card{background:#fff;border:1px solid #d8eadc;border-radius:18px;padding:16px;margin-bottom:14px}h2{font-size:18px;color:#075f2a;margin:0 0 12px}label{display:block;font-weight:800;margin:10px 0 5px}input{width:100%;font:inherit;font-size:16px;padding:12px;border:1.5px solid #acd9b8;border-radius:12px}button{font:inherit;border:1px solid #acd9b8;border-radius:12px;padding:12px;font-weight:900}.primary{background:#159447;color:#fff}.light{background:#eef9f1;color:#075f2a}.warn{background:#fff3c4;color:#6a4b00}.grid,.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{background:#f8fbf9;border:1px solid #d8eadc;border-radius:14px;padding:12px}.stat b{display:block;font-size:12px;color:#5d6b82}.stat strong{font-size:21px;color:#075f2a}.bar{height:16px;background:#e7ece9;border-radius:999px;overflow:hidden;margin:12px 0 5px}.bar div{height:100%;background:#159447;width:0}.small{font-size:12px;color:#65736b}.hidden{display:none}@media(max-width:520px){.grid,.stats{grid-template-columns:1fr}}</style></head><body><header><h1>翻訳文字数 管理</h1><div>教習所向け 多言語音声アプリ</div></header><main><section class="card" id="login"><h2>管理者ログイン</h2><label>管理者パスワード</label><input id="pw" type="password"><button class="primary" style="width:100%;margin-top:10px" onclick="login()">ログイン</button><p id="loginMsg" class="small"></p></section><div id="area" class="hidden"><section class="card"><h2>今月の利用状況</h2><div class="stats"><div class="stat"><b>対象月</b><strong id="month">--</strong></div><div class="stat"><b>使用文字数</b><strong id="used">0</strong></div><div class="stat"><b>基本上限</b><strong id="limit">0</strong></div><div class="stat"><b>追加枠</b><strong id="extra">0</strong></div><div class="stat"><b>合計上限</b><strong id="total">0</strong></div><div class="stat"><b>残り</b><strong id="remain">0</strong></div></div><div class="bar"><div id="bar"></div></div><div id="pct" class="small"></div><button class="light" style="width:100%;margin-top:10px" onclick="load()">最新情報に更新</button></section><section class="card"><h2>追加文字数</h2><div class="grid"><button class="light" onclick="add(5000)">＋5,000文字</button><button class="light" onclick="add(10000)">＋10,000文字</button><button class="light" onclick="add(50000)">＋50,000文字</button><button class="warn" onclick="setExtra(0)">追加枠を0に戻す</button></div><label>追加枠を直接設定</label><input id="customExtra" type="number" min="0"><button class="primary" style="width:100%;margin-top:8px" onclick="customExtra()">設定する</button></section><section class="card"><h2>基本上限</h2><input id="customLimit" type="number" min="1" value="50000"><button class="primary" style="width:100%;margin-top:8px" onclick="setLimit()">基本上限を変更</button><p class="small">通常は50,000文字のままでOKです。</p></section><section class="card"><button class="light" style="width:100%" onclick="logout()">ログアウト</button><p id="msg"></p></section></div></main><script>const API='/.netlify/functions/admin-usage';let password=sessionStorage.getItem('translationAdminPassword')||'';const f=n=>Number(n||0).toLocaleString('ja-JP');async function api(action,x={}){let r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,password,...x})});let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'通信エラー');return d}async function login(){password=pw.value;try{await load(true);sessionStorage.setItem('translationAdminPassword',password);document.getElementById('login').classList.add('hidden');area.classList.remove('hidden')}catch(e){loginMsg.textContent=e.message}}function logout(){sessionStorage.removeItem('translationAdminPassword');location.reload()}async function load(silent=false){let d=await api('get');month.textContent=d.month;used.textContent=f(d.used);limit.textContent=f(d.limit);extra.textContent=f(d.extra);total.textContent=f(d.totalLimit);remain.textContent=f(d.remaining);customLimit.value=d.limit;let p=d.totalLimit?Math.min(100,Math.round(d.used/d.totalLimit*100)):100;bar.style.width=p+'%';pct.textContent='使用率 '+p+'%';if(!silent)msg.textContent='更新しました';return d}async function add(amount){await api('addExtra',{amount});await load(true);msg.textContent=f(amount)+'文字を追加しました'}async function setExtra(value){if(!confirm('追加枠を '+f(value)+' 文字に設定しますか？'))return;await api('setExtra',{value});await load(true);msg.textContent='追加枠を更新しました'}async function customExtra(){let v=Number(document.getElementById('customExtra').value);if(!Number.isFinite(v)||v<0)return alert('0以上の数字を入力してください');await setExtra(Math.floor(v))}async function setLimit(){let v=Number(customLimit.value);if(!Number.isFinite(v)||v<1)return alert('1以上の数字を入力してください');if(!confirm('基本上限を '+f(v)+' 文字に変更しますか？'))return;await api('setLimit',{value:Math.floor(v)});await load(true);msg.textContent='基本上限を更新しました'}window.addEventListener('load',async()=>{if(password){try{await load(true);document.getElementById('login').classList.add('hidden');area.classList.remove('hidden')}catch(e){sessionStorage.removeItem('translationAdminPassword')}}});</script></body></html>
