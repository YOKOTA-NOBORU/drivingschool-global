<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f7a3f">
  <title>Driving School Global</title>
  <style>
    :root {
      --green: #0f7a3f;
      --green-dark: #0a5d30;
      --green-light: #eaf7ef;
      --blue: #1f6fd1;
      --blue-dark: #174f98;
      --text: #183029;
      --muted: #65736d;
      --card: #ffffff;
      --line: #dce7e1;
      --shadow: 0 12px 30px rgba(15, 64, 39, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top right, rgba(31, 111, 209, 0.10), transparent 34%),
        linear-gradient(180deg, #f4fbf7 0%, #eef6f2 100%);
    }

    .page {
      width: min(960px, 100%);
      margin: 0 auto;
      padding: 24px 18px 40px;
    }

    .hero {
      text-align: center;
      padding: 30px 14px 24px;
    }

    .logo {
      width: 92px;
      height: 92px;
      border-radius: 22px;
      object-fit: cover;
      box-shadow: var(--shadow);
      background: white;
    }

    h1 {
      margin: 18px 0 6px;
      font-size: clamp(28px, 5vw, 44px);
      line-height: 1.15;
      letter-spacing: 0.02em;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: clamp(15px, 2.8vw, 18px);
    }

    .menu {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
      margin-top: 24px;
    }

    .card {
      display: flex;
      align-items: center;
      gap: 18px;
      min-height: 180px;
      padding: 28px;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: var(--card);
      color: inherit;
      text-decoration: none;
      box-shadow: var(--shadow);
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    .card:hover,
    .card:focus-visible {
      transform: translateY(-3px);
      box-shadow: 0 16px 36px rgba(15, 64, 39, 0.17);
      outline: none;
    }

    .card:active {
      transform: translateY(0);
    }

    .icon {
      flex: 0 0 auto;
      width: 76px;
      height: 76px;
      border-radius: 20px;
      display: grid;
      place-items: center;
      font-size: 38px;
    }

    .voice .icon {
      background: var(--green-light);
    }

    .textbook .icon {
      background: #eaf2fd;
    }

    .card h2 {
      margin: 0 0 8px;
      font-size: clamp(21px, 3vw, 28px);
    }

    .card p {
      margin: 0;
      color: var(--muted);
      line-height: 1.7;
      font-size: 15px;
    }

    .arrow {
      margin-left: auto;
      font-size: 30px;
      font-weight: 700;
    }

    .voice .arrow {
      color: var(--green);
    }

    .textbook .arrow {
      color: var(--blue);
    }

    .notice {
      margin: 24px auto 0;
      padding: 14px 18px;
      max-width: 620px;
      text-align: center;
      border-radius: 14px;
      background: rgba(255,255,255,0.72);
      color: var(--muted);
      font-size: 14px;
    }

    footer {
      margin-top: 34px;
      text-align: center;
      color: #7b8983;
      font-size: 13px;
    }

    @media (max-width: 700px) {
      .page {
        padding: 16px 14px 28px;
      }

      .hero {
        padding-top: 22px;
      }

      .menu {
        grid-template-columns: 1fr;
        gap: 14px;
      }

      .card {
        min-height: 145px;
        padding: 22px 20px;
        border-radius: 20px;
      }

      .icon {
        width: 64px;
        height: 64px;
        font-size: 32px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="hero">
      <img class="logo" src="./icon-192.png" alt="教習所アプリのアイコン">
      <h1>Driving School Global</h1>
      <p class="subtitle">教習を支える多言語サポートアプリ</p>
    </section>

    <section class="menu" aria-label="アプリメニュー">
      <a class="card voice" href="./voice/">
        <div class="icon" aria-hidden="true">🔊</div>
        <div>
          <h2>多言語音声アプリ</h2>
          <p>教習フレーズの音声再生や、会話翻訳を利用できます。</p>
        </div>
        <span class="arrow" aria-hidden="true">›</span>
      </a>

      <a class="card textbook" href="./textbook/">
        <div class="icon" aria-hidden="true">📘</div>
        <div>
          <h2>教本アプリ</h2>
          <p>項目別の説明、教官ワンポイント、教本PDFを確認できます。</p>
        </div>
        <span class="arrow" aria-hidden="true">›</span>
      </a>
    </section>

    <p class="notice">
      使用するアプリを選んでください。
    </p>

    <footer>
      © Driving School Global
    </footer>
  </main>
</body>
</html>
